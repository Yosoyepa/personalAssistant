# governance/lint/legacy/.isort.cfg
#
# PERFIL DE COMPATIBILIDAD — inactivo por defecto.
# Equivalente de las reglas `I` del perfil ruff (governance/lint/ruff.toml).
# Activar con: wct config --lint-profile legacy

[settings]
profile = black
line_length = 100
known_first_party = example,wct
force_sort_within_sections = true
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3
skip_glob = build/*,.venv/*,governance/generated/*,quality/redteam/*

# Correspondencia de códigos con el perfil canónico:
#   isort (todos sus errores) → ruff I001, I002
# `isort --check-only --diff` es el comando que G-IMPORT-ORDER ejecuta con
# este perfil, en lugar de `ruff check --select I`.
