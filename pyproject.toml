[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.2.0-alpha.1"
description = "Shared contracts for a tenant-aware personal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.51.0",
]
test = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
]
postgres = [
  "psycopg[binary]>=3.3.4,<4",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.15.2",
  "diff-cover>=9.2",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pre-commit>=4.0",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_assistant*"]

[tool.setuptools.package-data]
personal_assistant = ["infrastructure/migrations/sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["personal_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the classic default rule set explicitly: ruff 0.16 widened its
# default select and flags 252 pre-existing diagnostics. Keep the
# previous rule set until a dedicated style phase triages them.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
