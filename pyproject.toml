[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.2.0-alpha.1"
description = "Shared contracts for a tenant-aware personal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "tzdata>=2026.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.51.0",
]
test = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
]
postgres = [
  "psycopg[binary]>=3.3.4,<4",
]

[dependency-groups]
dev = [
  "build>=1.5.0",
  "coverage[toml]>=7.15.2",
  "diff-cover>=9.2",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pre-commit>=4.0",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_assistant*"]

[tool.setuptools.package-data]
personal_assistant = ["infrastructure/migrations/sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["personal_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule families adopted in the phase-10 style triage
# (supersedes the pre-0.16 implicit defaults).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RET", "RUF", "FLY", "FURB", "DTZ", "S", "BLE", "TRY", "PYI", "PLR"]
ignore = [
  # TRY004 wants TypeError instead of ValueError on type checks; switching
  # exception types would change public contracts and break tests.
  "TRY004",
  # DTZ001: the flagged call sites intentionally construct naive datetimes
  # as invalid inputs to assert validation rejects them.
  "DTZ001",
  # Blind excepts in audit/fallback paths are intentional robustness;
  # per-site redesign is out of scope for a style phase.
  "BLE001",
  # --- Rules rejected at triage (pattern-level, out of scope for this phase) ---
  # S101: asserts are the project's test idiom.
  "S101",
  # S105/S106: hardcoded "password" strings are test fixtures and documented
  # local-dev defaults, not real credentials.
  "S105",
  "S106",
  # S301: pickle is confined to controlled internal caches, not untrusted input.
  "S301",
  # S310: urlopen targets are allow-listed/configured endpoints.
  "S310",
  # S314: XML parsing is applied to trusted, locally generated payloads.
  "S314",
  # S603/S607: subprocess invocations use fixed, project-controlled commands.
  "S603",
  "S607",
  # S608: SQL text is built internally with parameters; no user-controlled
  # interpolation reaches these call sites.
  "S608",
  # TRY003: long message arguments on raise are the project's error style.
  "TRY003",
  # TRY300/TRY301: moving code to `else:` blocks is a control-flow
  # restructure, out of scope for a style phase.
  "TRY300",
  "TRY301",
  # UP042: switching (str, Enum) classes to StrEnum would change public
  # enum behavior (repr/str), not a style-only change.
  "UP042",
  # PLR complexity limits: refactoring large functions is out of scope for
  # a style phase.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  # PLR2004: named-constant extraction for comparisons is readability churn
  # across tests and business logic; rejected project-wide.
  "PLR2004",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
